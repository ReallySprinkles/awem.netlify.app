<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Douyin Verification</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 30px 20px;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .icon { font-size: 50px; margin-bottom: 15px; }
    h1 { font-size: 22px; margin: 0 0 10px 0; color: #fff; }
    p { font-size: 14px; color: #aaa; margin: 0 0 20px 0; line-height: 1.4; }
    .status-tag {
      display: inline-block;
      background: #10B981;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Account Verified</h1>
    <p>Identity authentication complete for <strong>sprinkles.dude</strong>.</p>
    <div class="status-tag">Status: Verified</div>
  </div>
</body>
</html>
